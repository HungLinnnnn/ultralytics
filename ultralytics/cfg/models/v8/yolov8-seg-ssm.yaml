# Ultralytics YOLOv8-seg + SSM-Net head (GaborLLD + MambaCM + BDFUpsample + SGF)
# Backbone unchanged from official yolov8-seg
scale: l
nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]]
  - [-1, 1, Conv, [128, 3, 2]]
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [-1, 6, C2f, [256, True]]  # 4 (P3)
  - [-1, 1, Conv, [512, 3, 2]]
  - [-1, 6, C2f, [512, True]]  # 6 (P4)
  - [-1, 1, Conv, [1024, 3, 2]]
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]]    # 9 (P5)

head:
  # Gabor-LLD for P3/P4/P5
  - [4, 1, GaborLLDLow,  [5, 4]]                                          # 10 P3_low
  - [[4, 10], 1, GaborLLDHigh, [7, 4, 128, 4, 2, True]]                   # 11 P3_high

  - [6, 1, GaborLLDLow,  [5, 4]]                                          # 12 P4_low
  - [[6, 12], 1, GaborLLDHigh, [7, 4, 256, 4, 2, True]]                   # 13 P4_high

  - [9, 1, GaborLLDLow,  [5, 4]]                                          # 14 P5_low
  - [[9, 14], 1, GaborLLDHigh, [7, 4, 256, 4, 2, True]]                   # 15 P5_high (optional)

  # MambaCM on P4_low
  - [12, 1, MambaCM, [16, 2.0, 4]]                                        # 16 P4_low_enh

  # Top-down stage 1: P5 -> P4
  - [[14, 13, 16], 1, BDFUpsample, [2, 2.0]]                              # 17 U4
  - [[17, 13, 16], 1, SGF, [512, True]]                                   # 18 F4_in
  - [-1, 3, C2f, [512]]                                                  # 19 F4

  # Top-down stage 2: P4 -> P3
  - [[19, 11, 10], 1, BDFUpsample, [2, 2.0]]                              # 20 U3
  - [[20, 11, 10], 1, SGF, [256, True]]                                   # 21 F3_in
  - [-1, 3, C2f, [256]]                                                  # 22 F3

  # Bottom-up (unchanged pattern)
  - [-1, 1, Conv, [256, 3, 2]]                                           # 23
  - [[-1, 19], 1, Concat, [1]]                                           # 24
  - [-1, 3, C2f, [512]]                                                  # 25

  - [-1, 1, Conv, [512, 3, 2]]                                           # 26
  - [[-1, 9], 1, Concat, [1]]                                            # 27
  - [-1, 3, C2f, [1024]]                                                 # 28

  - [[22, 25, 28], 1, Segment, [nc, 32, 256]]                            # 29
