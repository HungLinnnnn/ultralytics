# YOLOv8-Seg with SSM-PAN neck (P3/8 - P5/32)
# Based on codex_context/260220.md plan

# Parameters
nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

# YOLOv8 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4-P3
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6-P4
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9-P5

head:
  # --- LLD decomposition ---
  - [4, 1, LLDLow, [5]] # 10 L3
  - [[4, 10], 1, LLDHigh_noGabor, []] # 11 H3
  - [6, 1, LLDLow, [5]] # 12 L4
  - [[6, 12], 1, LLDHigh_noGabor, []] # 13 H4
  - [9, 1, LLDLow, [5]] # 14 L5

  # --- P5 global anchor ---
  - [[10, 12, 14], 1, LowAggP5, [256, True]] # 15 Z5 (from L3, L4, L5)
  - [15, 1, MambaCM, [256, 32, 2.0, 4.0, 0.0, "fallback"]] # 16 G5
  - [[16, 14], 1, Concat, [1]] # 17 (G5 || L5)
  - [-1, 1, Conv, [256, 1, 1]] # 18 S5

  # --- Top-down P5 -> P4 ---
  - [[18, 13, 12], 1, BDFWarpUp, [2.0, False]] # 19 A4 (src=S5, high_t=H4, low_t=L4)
  - [[19, 12, 13], 1, SGF, [512, True, 0.2]] # 20 F4_in (M=A4, B=L4, E=H4)
  - [-1, 3, C2f, [512]] # 21 F4 (top-down P4)

  # --- Top-down P4 -> P3 ---
  - [[21, 11, 10], 1, BDFWarpUp, [2.0, False]] # 22 A3 (src=F4, high_t=H3, low_t=L3)
  - [[22, 10, 11], 1, SGF, [256, True, 0.2]] # 23 F3_in (M=A3, B=L3, E=H3)
  - [-1, 3, C2f, [256]] # 24 F3 (top-down P3)

  # --- Bottom-up P3 -> P4 (guide = F4) ---
  - [-1, 1, Conv, [256, 3, 2]] # 25 D4
  - [[25, 21, 21], 1, GateConcat, []] # 26 BU4
  - [-1, 3, C2f, [512]] # 27 F4_out

  # --- Bottom-up P4 -> P5 (guide = G5) ---
  - [-1, 1, Conv, [512, 3, 2]] # 28 D5
  - [[28, 18, 16], 1, GateConcat, []] # 29 BU5 = GateConcat(x=D5, y=S5, guide=G5)
  - [-1, 3, C2f, [1024]] # 30 F5_out

  # --- Segment head ---
  - [[24, 27, 30], 1, Segment, [nc, 32, 256]] # 31 Segment(F3, F4_out, F5_out)
