# YOLOv8-seg with FreqFusionCat replacing Upsample+Concat (P5->P4, P4->P3)
# feature_resample enabled inside FreqFusionCat

nc: 80
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9

head:
  - [[9, 6], 1, FreqFusionCat, []]  # 10: P5->P4 fusion
  - [-1, 3, C2f, [512]]             # 11

  - [[-1, 4], 1, FreqFusionCat, []] # 12: P4->P3 fusion
  - [-1, 3, C2f, [256]]             # 13 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]]      # 14
  - [[-1, 11], 1, Concat, [1]]      # 15
  - [-1, 3, C2f, [512]]             # 16 (P4/16)

  - [-1, 1, Conv, [512, 3, 2]]      # 17
  - [[-1, 9], 1, Concat, [1]]       # 18
  - [-1, 3, C2f, [1024]]            # 19 (P5/32)

  - [[13, 16, 19], 1, Segment, [nc, 32, 256]]  # 20
